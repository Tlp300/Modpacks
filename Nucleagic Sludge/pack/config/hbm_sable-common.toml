#HBM: Continuum x Sable Ă˘â‚¬â€ť tajemny4. Server controls gameplay; client controls audio.
[features]
	turretAim = true
	noseImpactDetonation = true
	machineSounds = true
	sublevelMissiles = true
	sublevelDrones = true
	sublevelMiningLaser = true
	spacePlanetaryGravity = true
	spaceCombustion = true
	spaceAirflow = true
	createHeat = true
	createSteam = true

[physics]
	#Minimum relative nose speed in m/s, not blocks/tick.
	# Default: 12.0
	# Range: 1.0 ~ 500.0
	impactSpeed = 12.0
	#Maximum angle between the nose and travel, and between nose and surface inward normal.
	# Default: 25.0
	# Range: 1.0 ~ 80.0
	impactAngleDegrees = 25.0
	#Maximum horizontal distance in blocks for a capsule to find a loaded ship port; altitude is ignored.
	# Default: 32.0
	# Range: 1.0 ~ 1024.0
	shipPortHorizontalRange = 32.0
	#Maximum X and Z distance in blocks between a coordinate-only drive and an unbound ship port.
	# Default: 16.0
	# Range: 1.0 ~ 1024.0
	shipDriveTargetTolerance = 16.0
